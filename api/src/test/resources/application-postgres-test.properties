# ProductDomain API PostgreSQL Test Configuration
# Test-specific properties for PostgreSQL database compatibility tests

# PostgreSQL database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:testuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:testpass}

# Test Connection Pool Configuration
spring.datasource.hikari.pool-name=ProductDomainAPIPostgresTestPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA Test Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# GraphQL Configuration
spring.graphql.graphiql.enabled=false
spring.graphql.websocket.path=/graphql

# Test Profile
spring.profiles.active=postgres-test

# Disable security for tests
spring.security.enabled=false

# Cucumber Configuration
cucumber.junit-platform.naming-strategy=long
cucumber.publish.enabled=false