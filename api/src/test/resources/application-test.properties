# ProductDomain API Test Configuration
# Test-specific properties for API module

# Use H2 in-memory database for tests (no external dependencies)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test Connection Pool Configuration
spring.datasource.hikari.pool-name=ProductDomainAPITestPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA Test Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# GraphQL Configuration
spring.graphql.graphiql.enabled=false
spring.graphql.websocket.path=/graphql

# Test Profile
spring.profiles.active=test

# Disable security for tests
spring.security.enabled=false

# Cucumber Configuration
cucumber.junit-platform.naming-strategy=long
cucumber.publish.enabled=false