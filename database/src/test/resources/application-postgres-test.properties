# ProductDomain Database PostgreSQL Test Configuration
# Test-specific properties for PostgreSQL database compatibility tests

# PostgreSQL database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:testuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:testpass}

# Test Connection Pool Configuration (smaller pool for tests)
spring.datasource.hikari.pool-name=ProductDomainPostgresTestPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000

# JPA Test Configuration - Auto-create schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# PostgreSQL specific settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Test Logging Configuration
logging.level.org.springframework.jdbc=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.erpmicroservices.productdomain=INFO

# Disable statistics for tests
spring.jpa.properties.hibernate.generate_statistics=false

# Test Transaction Configuration
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=false

# Cucumber Configuration
cucumber.junit-platform.naming-strategy=long
cucumber.publish.enabled=false